# runs/ holds frozen experiment evidence artifacts; formatters must never
# rewrite them (byte changes would invalidate digest-based manifests).
exclude: ^runs/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.17
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
